name: Weekly DVF data refresh

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dvf-weekly-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DVF_SITE_URL: https://dvf-explorer.sci-cimino-eggrickx.chatgpt.site
      DVF_UPLOAD_TOKEN: ${{ secrets.DVF_UPLOAD_TOKEN }}
      DVF_DUCKDB_MEMORY_LIMIT: 3GB
      DVF_EPHEMERAL_RAW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pipeline
        run: python -m pip install -r requirements.txt
      - name: Discover, compare, and publish DVF changes
        shell: bash
        run: |
          set -euo pipefail
          python -m src.main sync --site-url "$DVF_SITE_URL" | tee /tmp/dvf-refresh-summary.txt
          python -m src.main sync-geography --site-url "$DVF_SITE_URL" | tee -a /tmp/dvf-refresh-summary.txt
          cat /tmp/dvf-refresh-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Commit safe source metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- source_files.csv; then
            echo "No source metadata changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_files.csv
          git commit -m "data(dvf): record published source versions"
          git push
